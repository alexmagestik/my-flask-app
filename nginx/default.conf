upstream flask_backend {
    server flask-app:5000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress JSON / HTML responses
    gzip on;
    gzip_types application/json text/css application/javascript text/html;
    gzip_min_length 512;

    # Demo UI
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy every /api/* request to the Flask app, stripping the /api prefix.
    # Example: /api/multiply/6/7  ->  http://flask-app:5000/multiply/6/7
    location /api/ {
        proxy_pass http://flask_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Convenience health check through nginx (for load balancers / uptime monitors)
    location = /health {
        proxy_pass http://flask_backend/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
