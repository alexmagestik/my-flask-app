name: my-flask-app

services:
  # Flask application: container port 5000, published on host port 5001
  flask-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-flask-app:latest
    container_name: my-flask-app
    ports:
      - "5001:5000"
    environment:
      PORT: "5000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-net

  # nginx: static demo UI + reverse proxy for the Flask API
  nginx:
    image: nginx:1.27-alpine
    container_name: my-flask-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      flask-app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
